[build]
  base = "app"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Branch deploy of main (main--<site>.netlify.app): finalist screens on, so the team can see every feature.
# Production builds build/celik-mvp and does not read this section, so it stays as it is (D45, D47).
[context.main.environment]
  VITE_FINALIST = "1"
